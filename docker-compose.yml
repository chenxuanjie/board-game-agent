services:
  board-game-agent:
    image: board-game-agent:${IMAGE_TAG:?Set the imported release image tag}
    platform: ${BGA_IMAGE_PLATFORM:-linux/amd64}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      - web-account
    ports:
      - "${WEB_PORT:-8887}:80"
    volumes:
      - type: bind
        source: ${LIBRARY_PATH:?Set the existing NAS library folder}
        target: /data/library
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  web-account:
    image: board-game-agent-web-account:${IMAGE_TAG:?Set the imported release image tag}
    platform: ${BGA_IMAGE_PLATFORM:-linux/amd64}
    pull_policy: never
    restart: unless-stopped
    environment:
      SYNOLOGY_ORIGIN: ${SYNOLOGY_ORIGIN:?Set the trusted DSM HTTPS origin}
      # Historical account-ID namespace only; no network request uses this field.
      SYNOLOGY_IDENTITY_ORIGIN: ${SYNOLOGY_IDENTITY_ORIGIN:-${SYNOLOGY_ORIGIN}}
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:?Set the browser site origin}
      WEB_ALLOW_INSECURE_HTTP: ${WEB_ALLOW_INSECURE_HTTP:-false}
      LIBRARY_ROOT: /data/library
      LIBRARY_NAS_PATH: ${LIBRARY_NAS_PATH:?Set the matching FileStation library path}
    volumes:
      - type: bind
        source: ${LIBRARY_PATH:?Set the existing NAS library folder}
        target: /data/library
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
