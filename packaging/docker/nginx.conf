server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Revalidate entrypoints and resources after an application update.
    add_header Cache-Control "no-cache" always;
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Missing asset requests must not receive the application HTML.
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }
}
