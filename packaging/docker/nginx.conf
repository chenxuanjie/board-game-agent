map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}
map "${LIBRARY_ACCELERATION}:$uri" $catalog_file_delivery {
    default '';
    '~^1:/api/v1/apps/board_game_agent/catalog/resources/[^/]+/content$' nginx;
}
map $uri $web_asset_etag {
    volatile;
    # Preserve validators supplied by proxied APIs; only static files use the map.
    default $upstream_http_etag;
    include /opt/board-game-agent/web-etags.map;
}
map "$web_asset_etag|$http_if_none_match" $web_asset_not_modified {
    default 0;
    '~^"sha256:([a-f0-9]{64})"\|(?:.*,\s*)?(?:W/)?"sha256:\1"(?:\s*,.*)?$' 1;
    '~^"sha256:[a-f0-9]{64}"\|\*$' 1;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    resolver 127.0.0.11 valid=30s ipv6=off;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header ETag $web_asset_etag always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /api/ai/request {
        set $ai_upstream http://web-ai:8000;
        proxy_pass $ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
        proxy_send_timeout 35s;
        client_max_body_size 16m;
        access_log off;
    }
    # /api/v1/... -> /v1/...; /api/powersync/... -> /powersync/...
    location ^~ /api/ {
        proxy_pass ${APP_SERVICE_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-BGA-File-Delivery $catalog_file_delivery;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 16m;
        access_log off;
    }
    # Only the checked catalog API can internally enter this content-addressed mount.
    location ~ '^/_catalog_files/([a-f0-9]{2})/([a-f0-9]{64})$' {
        internal;
        alias /data/board-library/blobs/$1/$2;
        disable_symlinks on;
        sendfile on;
        etag off;
        if_modified_since off;
        add_header ETag $upstream_http_etag always;
        add_header Cache-Control 'public, max-age=0, must-revalidate' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        access_log off;
    }
    location /_catalog_files/ { return 404; }
    location / {
        etag off;
        if_modified_since off;
        if ($web_asset_not_modified) { return 304; }
        try_files $uri $uri/ /index.html;
    }
    location ~* \.[a-z0-9]+$ {
        etag off;
        if_modified_since off;
        if ($web_asset_not_modified) { return 304; }
        try_files $uri =404;
    }
}
