server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Revalidate entrypoints and resources after an application update.
    add_header Cache-Control "no-cache" always;
    location ^~ /api/account/ {
        proxy_pass http://web-account:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_send_timeout 10s;
        client_max_body_size 8k;
        access_log off;
    }
    location ^~ /api/library/ {
        proxy_pass http://web-account:8000;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 10s;
        client_max_body_size 1k;
        access_log off;
    }
    location ^~ /api/comments/ {
        proxy_pass http://web-account:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_send_timeout 10s;
        client_max_body_size 4m;
        access_log off;
    }
    # The gateway checks the public published-file allowlist, then issues an
    # internal redirect. Nginx serves the mounted file, including Range/304.
    location ^~ /library/ {
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://web-account:8000;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 10s;
        access_log off;
    }
    location ^~ /_library_files/ {
        internal;
        alias /data/library/;
        disable_symlinks on;
        # The gateway supplies an mtime-nanoseconds/size ETag. Nginx's default
        # second-resolution ETag can miss equal-size edits within one second.
        etag off;
        if_modified_since off;
        add_header ETag $upstream_http_etag always;
        max_ranges 1;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        limit_except GET { deny all; }
        access_log off;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Missing asset requests must not receive the application HTML.
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }
}
