name: board_game_agent
description: 一个参考 Ludomentor 风格、用于《波多黎各》的桌游助手安卓原型。
publish_to: 'none'
version: 5.0.0+55
environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_about:
    path: ../shared_packages/app_about
  app_ai_client:
    path: ../shared_packages/app_ai_client
  app_client:
    path: ../shared_packages/app_client
  app_identity:
    path: ../shared_packages/app_identity
  crypto: ^3.0.7
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.3
  http: ^1.6.0
  package_info_plus: ^8.3.0
  remote_update:
    path: ../shared_packages/remote_update
  remote_update_webdav:
    path: ../shared_packages/remote_update_webdav
  share_plus: ^11.1.0
  flutter_markdown: ^0.7.7+1
  pdfrx: ^2.3.2
  path_provider: ^2.1.5
  powersync: 2.5.0
  sqlite_async: 0.14.6
  sqlite3: 3.5.1
  uuid: 4.6.0
  shared_preferences: ^2.5.3
  web: 1.1.1
  speech_to_text: ^7.3.0
  file_picker: ^10.3.10
  webdav_settings:
    path: ../shared_packages/webdav_settings
  webdav_sync:
    path: ../shared_packages/webdav_sync
  window_manager: ^0.5.2

dependency_overrides:
  # Keep the Windows SAPI implementation in-repo so its compatibility fixes
  # stay versioned with the app while Android and Web use the upstream plugin.
  speech_to_text_windows:
    path: packages/speech_to_text_windows

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: 2.4.2

flutter:
  uses-material-design: true
  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf
    - family: National Day Display
      fonts:
        - asset: assets/fonts/NationalDayDisplay.ttf
  assets:
    - assets/fonts/OFL-NotoSansSC.txt
    - assets/fonts/OFL-NotoSerifSC.txt
    - assets/desktop/national_day/
    - assets/mobile/home/
    - assets/mobile/mine/
    - assets/mobile/detail/
    - assets/mobile/assistant/
    - assets/mobile/national_day/
    - assets/desktop/home/
    - assets/desktop/home/sidebar_icons/
    - assets/desktop/warmwood/
    - branding/app_icon.png
