name: board_game_agent
description: 一个参考 Ludomentor 风格、用于《波多黎各》的桌游助手安卓原型。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.3
  google_fonts: ^6.2.1
  http: ^1.6.0
  flutter_markdown: ^0.7.7+1
  pdfrx: ^2.3.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/games/puerto_rico/images/
    - assets/games/puerto_rico/docs/
    - assets/games/arkham_horror_lcg/images/
    - assets/games/arkham_horror_lcg/docs/
    - assets/games/startups/images/
    - assets/games/startups/docs/
