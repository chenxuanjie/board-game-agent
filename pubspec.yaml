name: board_game_agent
description: 一个参考 Ludomentor 风格、用于《波多黎各》的桌游助手安卓原型。
publish_to: 'none'
version: 2.1.0+22

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_about:
    path: ../shared_packages/app_about
  app_ai_client:
    path: ../shared_packages/app_ai_client
  crypto: ^3.0.7
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.3
  google_fonts: ^6.2.1
  http: ^1.6.0
  package_info_plus: ^8.3.0
  flutter_markdown: ^0.7.7+1
  pdfrx: ^2.3.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  speech_to_text: ^7.3.0
  file_picker: ^10.3.10
  webdav_settings:
    path: ../shared_packages/webdav_settings
  webdav_storage:
    path: ../shared_packages/webdav_storage
  window_manager: ^0.5.2

dependency_overrides:
  # Keep the Windows SAPI implementation in-repo so its compatibility fixes
  # stay versioned with the app while Android and Web use the upstream plugin.
  speech_to_text_windows:
    path: packages/speech_to_text_windows

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/mobile/home/
    - assets/mobile/mine/
    - assets/mobile/detail/
    - assets/desktop/home/
    - assets/desktop/home/sidebar_icons/
    - assets/desktop/warmwood/
    - branding/app_icon.png
    - assets/catalog.json
    # Registered rulebooks and FAQs are bundled for offline Web reading.
    - assets/games/puerto_rico/docs/official/rules/rulebook_en.pdf
    - assets/games/arkham_horror_lcg/docs/official/answers/faq_en.pdf
    - assets/games/arkham_horror_lcg/docs/official/rules/rulebook_en.pdf
