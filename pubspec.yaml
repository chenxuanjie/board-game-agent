name: board_game_agent
description: 一个参考 Ludomentor 风格、用于《波多黎各》的桌游助手安卓原型。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  app_ai_client:
    path: ../shared_packages/app_ai_client
  flutter_tts: ^4.2.3
  google_fonts: ^6.2.1
  http: ^1.6.0
  flutter_markdown: ^0.7.7+1
  pdfrx: ^2.3.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/storage_endpoints.json
    - assets/games/puerto_rico/images/
    - assets/games/puerto_rico/game.json
    - assets/games/arkham_horror_lcg/images/
    - assets/games/arkham_horror_lcg/game.json
    - assets/games/startups/images/
    - assets/games/startups/game.json
    - assets/games/cabo/images/
    - assets/games/cabo/game.json
    - assets/games/carcassonne_3/images/
    - assets/games/carcassonne_3/game.json
    - assets/games/harmonies/images/
    - assets/games/harmonies/game.json
    - assets/games/war_chest/images/
    - assets/games/war_chest/game.json
    - assets/games/decrypto/images/
    - assets/games/decrypto/game.json
    - assets/games/seven_wonders_duel/images/
    - assets/games/seven_wonders_duel/game.json
    - assets/games/splendor/images/
    - assets/games/splendor/game.json
    - assets/games/splendor_duel/images/
    - assets/games/splendor_duel/game.json
    - assets/games/exploding_kittens/images/
    - assets/games/exploding_kittens/game.json
    - assets/games/citadels/images/
    - assets/games/citadels/game.json
    - assets/games/in_a_grove/images/
    - assets/games/in_a_grove/game.json
    - assets/games/wriggle_roulette/images/
    - assets/games/wriggle_roulette/game.json
    - assets/games/manila/images/
